_target_: agents.WikiTextAgent
agent_name: navigate/lmql_headings
fewshot: 0
use_retry: True
max_tries: 3
max_actions: 50
use_back: True
use_feedback: True

multiturn_demonstrations: True

action_list: ["scroll_down", "back", "click", "jump_to"]
action_list_to_str: {"scroll_down": "scroll_down", "back": "back", "click": "click(article_link)", "jump_to": "jump_to(section)"}

agent_description: |-
  You are a expert JSON builder designed to assist in completing tasks.
  {replace[instructions]}{replace[feedback_prefix]}

instructions: |
  I'm playing a game where, given source and target Wikipedia articles, my goal is to reach the target article starting from the source article in as few clicks as possible. I need to click on the link to the article that will take me closer to the target, **only** from the provided candidates, which are the links I've already seen while browsing the current article. 
  The clickable articles are formatted like this in the article content: <a href="article_link">text</a>. I can also scroll down the page or jump to a section, to see more content and links, or go back to the previous article.
  
  ##Input
  You will be given input in the JSON format as described below
  Input format:
  {"window_content": "<content of the current article window>",  "remaining_scrolls": "<number of scrolls left on this article>", "source": "<current article I am on>", "target": "<target article>", "article_links_seen_so_far": "<outgoing links seen in this article so far>", "article_sections": "<sections in this article I can jump to>", "previous_article": "<previous article>", "available_actions": "<actions I can take, all the possible ones are scroll_down, back, click(article_link), jump_to(section)>"}

  ##Output
  You should only respond in the JSON format as described below
  Output format:
  {"answer": "<your final answer to the user>"}

  For example, if I'm on the article for Animal, want to get to the article for China and I have seen the links Dog;Biology;Eagle;Amazon_Forest on the page, clicking on Eagle would be a good choice, since China has a very strong connection to the United States, and the mascot for the United States is the Eagle. Therefore, a good response would be:
  {"answer": "click(Eagle)"}

  Attention: I'm in a hurry so I shouldn't spend too much time on a single page.
  Let's start!
user_template: |-
  {{"window_content": "{replace[content]}",  "remaining_scrolls": "{replace[remaining_scrolls]}", "source": "{replace[src]}", "target": "{replace[tgt]}", "article_links_seen_so_far": "{replace[links]}", "article_sections": "{replace[headings]}", "previous_article": "{replace[prev]}", "available_actions": "{replace[actions_str]}"}}

user_initial_prefix: |
  
lmql_query_str: |-
  lmql
  sample(n=1, temperature={model_cfg[temperature]}, top_p={model_cfg[top_p]}, max_len=2*{model_cfg[max_len]})
  """{prompt}"""
  """{{"answer": "[next_action]""" where next_action in set(action_list)
  if next_action=='click':
      """([link])"}}""" where link in set(links)
  elif next_action=='jump_to':
      """([heading])"}}""" where heading in set(headings)
  else:
      """"}}"""


assistant_prefix: "" # no prefix because this is done in the lmql query function
demonstration_template: ""

demonstrations_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/fewshot_click_demonstrations.tsv
agent_runs_file: ${agent_runs_file}

