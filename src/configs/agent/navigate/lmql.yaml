_target_: lmql_agents.WikiTextAgent
fewshot: 0
use_retry: True
max_tries: 3
max_actions: 50
use_back: True
use_feedback: True

multiturn_demonstrations: True

action_list: ["scroll_down", "back", "click"]
agent_description: |-
  You are a helpful assistant that helps the User complete tasks.

instructions: |
  I'm playing a game with the objective of getting from a source Wikipedia article to a target article in the least amount of clicks.
  I can only click on articles that are visible on the current page, and the clickable articles are formatted like this: [article_text](article).
  I can also scroll down the page to see more content and links, or go back to the previous page.
  Always respond to me in the format:
  Thought:
  [your thought process in one line]
  Action:
  [action I should take]

user_template: |-
  Here's what I see on the page:
  [WINDOW_TOP]
  {replace[content]}
  [WINDOW_BOTTOM]
  I'm on the Wikipedia page for {replace[src]} and I want to get to the page for {replace[tgt]} in the least amount of clicks. The articles that I can click on now are: {replace[links]}.
  I have {replace[remaining_scrolls]} scrolls left on this page. I can either: click on a link that will get me closer to the target, scroll down the page, or go back to the previous page: {replace[prev]}. First tell me your thought process and then tell me what to do. Respond with "back", "click(article)", or "scroll_down".
  
user_initial_prefix: |
  {replace[instructions]}{replace[feedback_prefix]}
  
assistant_prefix: "" # no prefix because this is done in the lmql query function
demonstration_template: ""

demonstrations_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/fewshot_click_demonstrations.tsv
agent_runs_file: ${agent_runs_file}

