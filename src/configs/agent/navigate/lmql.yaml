_target_: agents.WikiTextAgent
agent_name: navigate/lmql
fewshot: 0
use_retry: True
max_tries: 3
max_actions: 50
use_back: True
use_feedback: True

multiturn_demonstrations: True

action_list: ["scroll_down", "back", "click"]
agent_description: |-
  You are a helpful assistant that helps the User complete tasks.

instructions: |
  I'm playing a game with the objective of getting from a source Wikipedia article to a target article in the least amount of clicks.
  I can only click on articles I've already seen by scrolling the page, and the clickable articles are formatted like this: [article](article_link).
  I can also scroll down the page to see more content and links, or go back to the previous page.
  Always respond to me in the format:
  Thought:
  [your thought process in one line. Example: "We want to get closer to the target page Einstein from the source page Science. Einstein was a famous physicist, and Physics is a subset of Science. There is a link to Physics on the page, so we should click on it."]
  Action:
  [action I should take. Example: "click(Physics)"]

user_template: |-
  Here's what I see on the page {replace[src]}:
  [TOP OF WINDOW]
  {replace[content]}
  [BOTTOM OF WINDOW]
  I'm on the Wikipedia page for {replace[src]} and I want to get to the page for {replace[tgt]} in the least amount of clicks. The article links I've already seen in this article and that I can click on are: {replace[links_seen_on_current_page]}.
  I have {replace[remaining_scrolls]} scrolls left on this page. I can either: click on a link that will get me closer to the target, scroll down the page, or go back to the previous page: {replace[prev]}. First tell me your thought process and then tell me what to do. Respond with "back", "click(article_link)", or "scroll_down".
  
user_initial_prefix: |
  {replace[instructions]}{replace[feedback_prefix]}
  
lmql_query_str: |-
  lmql
  sample(n=1, temperature={model_cfg[temperature]}, top_p={model_cfg[top_p]}, max_len={model_cfg[max_len]})
  """{prompt}\n"""
  """Thought:\n[thought]\n""" where stops_before(thought, 'Action:')
  """Action:\n[next_action]""" where next_action in set(action_list)
  if next_action=='click':
      """([link])""" where link in set(links)


assistant_prefix: "" # no prefix because this is done in the lmql query function
demonstration_template: ""

demonstrations_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/fewshot_click_demonstrations.tsv
agent_runs_file: ${agent_runs_file}

