_target_: agents.LinkClickAgent
agent_description: |-
  Assistant is a expert JSON builder designed to assist the user in playing play the game of Wikispeedia. Assistant is familiar with all Wikipedia pages and can help the user find a path between two Wikipedia articles.
  In Wikispeedia, given two Wikipedia articles, a source and a target, your goal is to reach the target article starting from the source article in as few clicks as possible. For the articles given this is always possible. Choose **only** from the provided candidates.

  All of Assistant's communication is performed using this JSON format.


user_template: |-
  I'm currently on the page {replace[src]} and the target page is {replace[tgt]}. Tell me what link I should click on to get closer to the target. This is a list of links on the current page:{replace[links]}
  
assistant_prefix: |
  {

demonstration_template: |-
  {{
    "next_page": "{replace[click]}"
  }}

demonstrations_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/click_demonstrations.tsv

fewshot: 3
use_retry: True
max_errors: 2
multiturn_demonstrations: True