_target_: agents.LinkClickDFSAgent
agent_name: link_click/dfs_back_completion
fewshot: 1
use_retry: True
max_tries: 3
max_actions: 50
use_back: True
use_feedback: True

multiturn_demonstrations: False

agent_description: |
  Assistant is a expert JSON builder designed to assist the user in playing play the game of Wikispeedia. Assistant is familiar with all Wikipedia pages and can help the user find a path between two Wikipedia articles.
  
  This is a conversation between an Assistant and a User, playing the game of Wikispeedia. 
  User: Here are the instructions for the game.
  {replace[instructions]}{replace[feedback_prefix]}
  Assistant: {{"response": "Understood. Let's start the game."}}
  {replace[fewshot_demonstrations]}
#Here is the latest conversation between the Assistant and the User:


instructions: |
  In Wikispeedia, given two Wikipedia articles, a source and a target, the goal is to reach the target article starting from the source article in as few clicks as possible. For the articles given this is always possible. The Assistant chooses the page that will take the user closer to the target, **only** from the provided candidates. If no available link takes you closer to the target, Assistant selects "NA" as the next page.

  ##Input
  The user input is in the JSON format as described below
  Input format:
  {"source": "<source article>", "target": "<target article>", "links": "<outgoing links from current article>"}

  ##Output
  The Assistant only responds in the JSON format as described below
  Output format:
  {"next_page": "<chosen page for user to click on>"}

user_initial_prefix: ""

user_template: |- #the 'User: ' gets added in prepare_completion()
  {{"source": "{replace[src]}", "target": "{replace[tgt]}", "pages": "{replace[links]}"}}
  
assistant_prefix: |-
  {"

demonstration_template: |
  User: {replace[user_template]}
  Assistant: {{"next_page": "{replace[click]}"}}

demonstrations_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/fewshot_click_demonstrations.tsv
agent_runs_file: ${agent_runs_file}

