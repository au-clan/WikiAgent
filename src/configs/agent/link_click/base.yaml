_target_: agents.LinkClickAgent
agent_name: link_click/base
fewshot: 1
use_retry: True
max_tries: 3
max_actions: 50
use_back: False
use_feedback: True

multiturn_demonstrations: True

agent_description: |-
  Assistant is a expert JSON builder designed to assist the user in playing play the game of Wikispeedia. Assistant is familiar with all Wikipedia pages and can help the user find a path between two Wikipedia articles.
  {replace[instructions]}

instructions: |
  In Wikispeedia, given two Wikipedia articles, a source and a target, your goal is to reach the target article starting from the source article in as few clicks as possible. For the articles given this is always possible. Choose the page that will take the user closer to the target, **only** from the provided candidates.
  
  ##Input
  You will be given input in the JSON format as described below
  Input format:
  {"source": "<source article>", "target": "<target article>", "links": "<outgoing links from current article>"}

  ##Output
  You should only respond in the JSON format as described below
  Output format:
  {"next_page": "<chosen page for user to click on>"}
  Ensure the response can be parsed by Python json.loads

user_initial_prefix: ""

user_template: |-
  {{"source": "{replace[src]}", "target": "{replace[tgt]}", "links": "{replace[links]}"}}
  
assistant_prefix: |-
  {"

demonstration_template: |-
  {{"next_page": "{replace[click]}"}}

demonstrations_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/fewshot_click_demonstrations.tsv
agent_runs_file: ${agent_runs_file}

