_target_: agents.LinkClickDFSAgent
agent_name: link_click/lmql_dfs_back
fewshot: 1
use_retry: True
max_tries: 3
max_actions: 50
use_back: True
use_feedback: True

multiturn_demonstrations: True

agent_description: |-
  You are a expert JSON builder designed to assist in completing tasks.
  {replace[instructions]}{replace[feedback_prefix]}

instructions: |
  I'm playing a game where, given source and target Wikipedia articles, my goal is to reach the target article starting from the source article in as few clicks as possible. I need to click on the link to the article that will take me closer to the target, **only** from the provided candidates. If no available article takes me closer to the target, I can select select "NA" as the next article to go back to the previous article.

  ##Input
  You will be given input in the JSON format as described below
  Input format:
  {"source": "<source article>", "target": "<target article>", "links": "<outgoing links from current article>"}

  ##Output
  You should only respond in the JSON format as described below
  Output format:
  {"next_article": "<chosen article for user to click on>"}
  Ensure the response can be parsed by Python json.loads

user_template: |-
  {{"source": "{replace[src]}", "target": "{replace[tgt]}", "links": "{replace[links]}"}}
  
demonstration_template: |-
  {{"next_article": "{replace[click]}"}}

lmql_query_str: |-
  lmql
  sample(n=1, temperature={model_cfg[temperature]}, top_p={model_cfg[top_p]}, max_len=2*{model_cfg[max_len]})
  """{prompt}"""
  """{{"next_article": "[next_page]"}}""" and next_page in set(candidates)

assistant_prefix: "" # no prefix because this is done in the lmql query function
user_initial_prefix: ""

demonstrations_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/fewshot_click_demonstrations_new.tsv
agent_runs_file: ${agent_runs_file}

