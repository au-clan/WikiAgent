_target_: 
model_provider: openai
model_name: gpt-4-1106-preview
model_path: 
model_type: chat

temperature: 0.5
max_len: 4096
dtype: bfloat16 #set to float32 if on CPU
load_in_8bit: False
load_in_4bit: False
