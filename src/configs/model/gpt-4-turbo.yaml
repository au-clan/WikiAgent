top_p: 1
do_sample: True # if False is the same as temperature = 0
device: 'cuda' # or cpu

stop: '}'

lmql:
  batch_size: ${..batch_size}
  dtype: ${..dtype}
  load_in_8bit: ${..load_in_8bit}
  load_in_4bit: ${..load_in_4bit}
