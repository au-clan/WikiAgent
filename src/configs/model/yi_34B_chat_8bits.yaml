_target_: models.huggingface_model.HuggingFaceModel
model_provider: huggingface
model_name: 01-ai/Yi-34B-Chat-8bits
model_path:
model_type: chat

temperature: 0.5
max_len: 4096
#dtype: bfloat16 #set to False if on CPU
load_in_8bit: False
load_in_4bit: False
num_threads: 16
batch_size: 1
top_p: 1
do_sample: True # if False is the same as temperature = 0
device: 'cuda' # or cuda

stop: '}'

lmql:
  batch_size: ${..batch_size}
  dtype: ${..dtype}
  inprocess: False
  load_in_8bit: ${..load_in_8bit}
  load_in_4bit: ${..load_in_4bit}
  use_flash_attention_2: True

