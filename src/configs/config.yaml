defaults:
  - _self_
  - experiments: defaults_inference
  - model: llama_2_7b_chat_hf
  - agent: link_click_agent
  - hydra: inference

# Directories
work_dir: ${hydra:runtime.cwd}
data_dir: ${work_dir}/data
# path to output directory, created dynamically by hydra
output_dir: ${hydra:runtime.output_dir}
# other paths
agent_prompts_dir: ${data_dir}/agent_prompts

# determines the log directory's parent folder
experiment_name: inference
