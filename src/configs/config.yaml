defaults:
  - _self_
  - experiment: random
  - model: mistral_7b_instruct_v0.2
  - agent: navigate/lmql_headings
  - hydra: inference

# Directories (these are absolute paths on the nfs server)
nfs_dir: /dlabdata1
work_dir: ${nfs_dir}/charneca/WikiNav #${hydra:runtime.cwd} if running locally only
data_dir: ${work_dir}/data

# path to output directory, created dynamically by hydra
logs_dir: ${work_dir}/logs

agent_runs_file: ${hydra:runtime.output_dir}/agent_runs.tsv
paths_real_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/paths_real_processed.tsv
links_file: ${data_dir}/wikispeedia/wikispeedia_paths-and-graph/links.tsv
pages_folder: ${data_dir}/wpcd/wp/
restart_from_agents_file: ""

# determines the log directory's parent folder
experiment_name: inference
run_name: run #for sweep runs folder
